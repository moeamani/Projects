name: Build and test
on:
  push:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gantt-app
          path: build/Gantt.zip
